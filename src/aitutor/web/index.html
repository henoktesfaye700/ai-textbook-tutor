<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Textbook Tutor</title>
<style>
:root{--bg:#f2f6f5;--sf:#fff;--tx:#14262b;--mu:#5a6e72;--ac:#0f4c5c;--ac2:#e09f3e;--ln:#d5e0de}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1d;--sf:#16272b;--tx:#e6efee;--mu:#93a9ac;--ac:#6cc1d4;--ac2:#e8b25c;--ln:#27403f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Noto Sans Ethiopic",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{margin:0 0 4px}
.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
input,select{padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit}
input{flex:1;min-width:200px}
button{padding:9px 14px;border-radius:8px;border:0;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
button.alt{background:none;color:var(--ac);border:1px solid var(--ac)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:12px 0}
.hint{color:var(--ac2);font-weight:600}.cite{border-left:3px solid var(--ac2);padding:4px 10px;margin:10px 0;font-size:14px}
.cite a{color:var(--ac);font-weight:600}.cite img{max-width:100%;border:1px solid var(--ln);border-radius:6px;margin-top:8px}
</style></head><body><main>
<h1>AI Textbook Tutor</h1><p class="mu">Ask your textbook. Answers come only from the books on this device.</p>
<div class="row"><select id="subject"><option value="">All subjects</option></select>
<select id="grade"><option value="">All grades</option></select>
<select id="lang" hidden aria-label="Answer language"><option>English</option><option>Amharic</option>
<option>Afan Oromo</option><option>Somali</option></select></div>
<div class="row"><input id="q" placeholder="Ask a question..." aria-label="Question" autocomplete="off">
<button id="go">Ask</button></div>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){
  try{
    const res=await fetch("/api/library");
    if(res.status===401){location.href="/enter";return;}
    const lib=await res.json();
    lib.subjects.forEach(s=>$("#subject").insertAdjacentHTML("beforeend",`<option>${esc(s)}</option>`));
    lib.grades.forEach(g=>$("#grade").insertAdjacentHTML("beforeend",`<option>${esc(g)}</option>`));
    if(lib.ai)$("#lang").hidden=false;  // language choice only matters when an AI model is running
  }catch(e){}
}
function citeHtml(c,i){
  let h=`<div class="cite"><b>${esc(c.text)}</b>`;
  if(c.link){
    h+=` &nbsp;<a href="${esc(c.link)}" target="_blank" rel="noopener">Open PDF page ${esc(c.pdf_page)}</a>`;
    h+=` <button class="alt" data-prev="${i}">Preview page</button><div id="pv${i}"></div>`;
  }
  return h+`<details><summary>Textbook excerpt</summary>${esc(c.excerpt)}</details></div>`;
}
function render(r){
  const out=$("#out");
  if(!r.grounded){out.innerHTML=`<div class="box">${esc(r.answer)}</div>`;return;}
  out.innerHTML=`<div class="box"><p class="mu">Think first</p><p class="hint">${esc(r.hint)}</p>
    <button id="rv">Show textbook answer</button>
    <div id="rev" hidden><p>${esc(r.answer)}</p>
    ${r.ai?`<p class="mu">Written by an AI model and checked against the textbook (${esc(r.removed)} unsupported sentence(s) removed).</p>`:""}
    ${r.citations.map(citeHtml).join("")}</div></div>`;
  $("#rv").onclick=()=>{$("#rev").hidden=false;$("#rv").hidden=true;};
  out.querySelectorAll("[data-prev]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.prev,box=$("#pv"+i);
    if(box.firstChild){box.innerHTML="";return;}
    const img=new Image();img.alt="Textbook page preview with your words highlighted";
    img.onerror=()=>{box.textContent="Preview is not available on this device. Use the PDF link.";};
    img.src=r.citations[i].preview;box.appendChild(img);
  });
}
async function ask(){
  const q=$("#q").value.trim();if(!q)return;
  const body={question:q,subject:$("#subject").value||null,grade:+$("#grade").value||null,lang:$("#lang").value};
  try{
    const res=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(res.status===401){location.href="/enter";return;}
    render(await res.json());
  }catch(e){$("#out").innerHTML='<div class="box">Could not reach the tutor on this device.</div>';}
}
$("#go").onclick=ask;$("#q").onkeydown=e=>{if(e.key==="Enter")ask();};
init();
</script></main></body></html>
