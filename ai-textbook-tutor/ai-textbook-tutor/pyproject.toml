[project]
name = "aitutor"
version = "0.6.0"
description = "Offline, curriculum-grounded AI tutor for local-language learners"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/henoktesfaye700/ai-textbook-tutor"
Source = "https://github.com/henoktesfaye700/ai-textbook-tutor"
[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
aitutor = ["web/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aitutor = "aitutor.cli:main"
