<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tutor dashboard</title>
<style>
:root{--bg:#f2f6f5;--sf:#fff;--tx:#14262b;--mu:#5a6e72;--ac:#0f4c5c;--ac2:#e09f3e;--bad:#b3402f;--ln:#d5e0de}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1d;--sf:#16272b;--tx:#e6efee;--mu:#93a9ac;--ac:#6cc1d4;--ac2:#e8b25c;--bad:#f08a78;--ln:#27403f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}h1{margin:0}h2{font-size:17px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
select,button{padding:8px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit}
button{cursor:pointer}button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi,.box{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{margin:12px 0;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.bar{display:inline-block;width:90px;height:9px;background:var(--ln);border-radius:5px;overflow:hidden;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--ac)}.bar.low i{background:var(--bad)}
.tag{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--bad);color:var(--bad);margin-right:4px}
svg{width:100%;height:auto;display:block}
</style></head><body><main>
<h1>AI Tutor dashboard</h1>
<p class="mu">Anonymous results synced from student devices. One device = one student.</p>
<div class="row">
 <select id="school" aria-label="School"></select><select id="project" aria-label="Project"></select>
 <select id="class_id" aria-label="Class"></select><select id="subject" aria-label="Subject"></select>
 <select id="days" aria-label="Period"><option value="">All time</option><option value="7">Last 7 days</option>
 <option value="30">Last 30 days</option></select>
 <button id="csv">Download CSV</button> <button id="pdf">PDF report</button> <button id="lib">Library</button> <button id="out">Log out</button>
</div>
<div class="kpis" id="kpis"></div>
<div class="box"><h2>Compare by</h2>
 <div class="row" id="tabs"></div><table id="by"></table></div>
<div class="box"><h2>Daily activity <span class="mu">(bars: attempts, line: accuracy)</span></h2><div id="trend"></div></div>
<div class="grid">
 <div class="box"><h2>Students needing attention</h2><table id="stu"></table></div>
 <div class="box"><h2>Hardest questions</h2><table id="qs"></table></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIMS=["school","project","class","subject","topic"];let dim="school";
const FIELDS=[["school","All schools"],["project","All projects"],["class_id","All classes"],["subject","All subjects"]];
const pct=x=>Math.round(x*100)+"%";
function qs(extra){
  const p=new URLSearchParams();
  for(const [k] of FIELDS.concat([["days"]])){const v=$("#"+k).value;if(v)p.set(k,v);}
  for(const k in (extra||{}))p.set(k,extra[k]);
  return p.toString();
}
async function api(path,extra){
  const r=await fetch(path+"?"+qs(extra));
  if(r.status===401){location.href="/login";throw new Error("Session expired");}
  if(!r.ok)throw new Error(path+" returned "+r.status);
  return r.json();
}
function bar(a){return `<span class="bar ${a<0.5?"low":""}"><i style="width:${Math.round(a*100)}%"></i></span>${pct(a)}`;}
async function loadFilters(){
  const f=await api("/analytics/filters");
  FIELDS.forEach(([k,label])=>{
    const el=$("#"+k),keep=el.value;
    el.innerHTML=`<option value="">${label}</option>`+(f[k]||[]).map(v=>`<option>${esc(v)}</option>`).join("");
    el.value=keep;
  });
}
function kpis(s){
  const cards=[["Students",s.students],["Active (7 days)",s.active_7d],["Attempts",s.attempts],
    ["Accuracy",pct(s.accuracy)],["Schools",s.schools],["Classes",s.classes],["Subjects",s.subjects]];
  $("#kpis").innerHTML=cards.map(([l,v])=>`<div class="kpi"><b>${esc(v)}</b><span class="mu">${l}</span></div>`).join("");
}
function tabs(){
  $("#tabs").innerHTML=DIMS.map(d=>`<button data-d="${d}" class="${d===dim?"on":""}">${d[0].toUpperCase()+d.slice(1)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{dim=b.dataset.d;load();});
}
function byTable(t){
  const head=`<tr><th>${esc(t.dim)}</th><th>Students</th><th>Attempts</th><th>Accuracy</th><th></th></tr>`;
  $("#by").innerHTML=head+(t.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.students}</td><td>${r.attempts}</td><td>${bar(r.accuracy)}</td>
    <td>${r.needs_review?'<span class="tag">needs review</span>':""}</td></tr>`).join("")||'<tr><td colspan="5" class="mu">No data for these filters.</td></tr>');
}
function chart(days){
  if(!days.length){$("#trend").innerHTML='<p class="mu">No activity for these filters.</p>';return;}
  const W=640,H=170,pad=22,n=days.length,max=Math.max(...days.map(d=>d.attempts)),bw=(W-2*pad)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily attempts and accuracy">`;
  days.forEach((d,i)=>{const h=(H-2*pad)*d.attempts/max;
    s+=`<rect x="${(pad+i*bw+1).toFixed(1)}" y="${(H-pad-h).toFixed(1)}" width="${Math.max(bw-2,1).toFixed(1)}" height="${h.toFixed(1)}" fill="var(--ac)" opacity=".4"><title>${esc(d.day)}: ${d.attempts} attempts, ${d.students} students</title></rect>`;});
  const pts=days.map((d,i)=>`${(pad+i*bw+bw/2).toFixed(1)},${(H-pad-(H-2*pad)*d.accuracy).toFixed(1)}`).join(" ");
  s+=`<polyline points="${pts}" fill="none" stroke="var(--ac2)" stroke-width="2"/>`;
  s+=`<text x="${pad}" y="${H-6}" font-size="11" fill="var(--mu)">${esc(days[0].day)}</text>`;
  s+=`<text x="${W-pad}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--mu)">${esc(days[n-1].day)}</text></svg>`;
  $("#trend").innerHTML=s;
}
function students(d){
  $("#stu").innerHTML=`<tr><th>Student</th><th>Class</th><th>Accuracy</th><th>Last active</th><th></th></tr>`+
   (d.students.filter(x=>x.at_risk.length).slice(0,10).map(x=>`<tr><td>${esc(x.student)}</td><td>${esc(x.class)}</td><td>${pct(x.accuracy)}</td>
    <td>${esc(x.last_active)}</td><td>${x.at_risk.map(r=>`<span class="tag">${esc(r)}</span>`).join("")}</td></tr>`).join("")||'<tr><td colspan="5" class="mu">No students flagged.</td></tr>');
}
function questions(d){
  $("#qs").innerHTML=`<tr><th>Topic</th><th>Tries</th><th>Accuracy</th></tr>`+
   (d.questions.map(q=>`<tr><td>${esc(q.topic)} <span class="mu">${esc(q.question_id)}</span></td><td>${q.attempts}</td><td>${bar(q.accuracy)}</td></tr>`).join("")||'<tr><td colspan="3" class="mu">Not enough data yet.</td></tr>');
}
async function load(){
  tabs();
  try{
    const [s,b,t,st,q]=await Promise.all([api("/analytics/summary"),api("/analytics/by/"+dim),api("/analytics/timeseries"),
      api("/analytics/students"),api("/analytics/questions")]);
    kpis(s);byTable(b);chart(t.days);students(st);questions(q);
  }catch(e){$("#kpis").innerHTML=`<div class="kpi">Could not load data: ${esc(e.message)}</div>`;}
}
FIELDS.concat([["days"]]).forEach(([k])=>$("#"+k).onchange=load);
$("#lib").onclick=()=>{location.href="/teacher/library";};
$("#pdf").onclick=()=>{location.href="/analytics/report.pdf?"+qs();};
$("#out").onclick=async()=>{await fetch("/api/logout",{method:"POST"});location.href="/login";};
$("#csv").onclick=()=>{location.href="/analytics/export.csv?"+qs({dim});};
loadFilters().then(load).catch(load);
</script></main></body></html>
