<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Textbook Tutor: access</title>
<style>
:root{--bg:#f2f6f5;--sf:#fff;--tx:#14262b;--mu:#5a6e72;--ac:#0f4c5c;--bad:#b3402f;--ln:#d5e0de}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1d;--sf:#16272b;--tx:#e6efee;--mu:#93a9ac;--ac:#6cc1d4;--bad:#f08a78;--ln:#27403f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
form{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:22px;width:min(92vw,340px)}
h1{margin:0 0 4px;font-size:22px}p{margin:0 0 14px;color:var(--mu);font-size:14px}
input,button{width:100%;padding:11px;border-radius:8px;border:1px solid var(--ln);font:inherit;margin-top:8px}
input{background:var(--bg);color:var(--tx)}button{background:var(--ac);color:var(--bg);border:0;font-weight:600;cursor:pointer}
#err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
</style></head><body>
<form id="f"><h1>AI Textbook Tutor</h1><p>Enter the access code your teacher gave you.</p>
<input id="pw" type="password" placeholder="Access code" aria-label="Access code" autocomplete="off" autofocus>
<button type="submit">Enter</button><div id="err" role="alert"></div></form>
<script>
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();
  const err=document.getElementById("err");err.textContent="";
  try{
    const r=await fetch("/api/enter",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:document.getElementById("pw").value})});
    if(r.ok){location.href="/";return;}
    const d=await r.json();err.textContent=d.detail||"Login failed";
  }catch(x){err.textContent="Could not reach the server.";}
};
</script></body></html>
